name: Release

# Push a tag that matches the package.json version (e.g. bump to 1.0.0-beta.1, then
# `git tag v1.0.0-beta.1 && git push --tags`) to build installers for all three OSes and
# upload them to a GitHub Release. `workflow_dispatch` lets you run it by hand from the Actions
# tab too. macOS must build on a Mac runner — you can't cross-build a .dmg from Windows/Linux.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # electron-builder creates/updates the GitHub Release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # BETA: the app runs against the DEV backend, so we bake the DEV deployment's PUBLIC client
      # config in at build time. These `VITE_*` values are NOT secrets — they ship inside the
      # renderer of every build anyway — so set them as repo **Variables**
      # (Settings → Secrets and variables → Actions → Variables), not Secrets.
      - name: Write .env.local (dev/beta client config)
        shell: bash
        run: |
          cat > .env.local <<EOF
          VITE_CONVEX_URL=${{ vars.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL=${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_WORKOS_CLIENT_ID=${{ vars.VITE_WORKOS_CLIENT_ID }}
          VITE_WORKOS_REDIRECT_URI=${{ vars.VITE_WORKOS_REDIRECT_URI }}
          VITE_LIVEKIT_URL=${{ vars.VITE_LIVEKIT_URL }}
          VITE_APP_URL=${{ vars.VITE_APP_URL }}
          EOF

      # Notarization's App Store Connect key is a *file* (`AuthKey_<id>.p8`) and `APPLE_API_KEY`
      # holds its PATH, not its contents — so the base64 secret has to be written to disk first.
      # A no-op when the secret is unset (the build then just isn't notarized).
      - name: Materialize Apple API key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            mkdir -p ~/private_keys
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey.p8
            echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # One command per OS: build the renderer/main/preload, then package + upload to the Release.
      # `GH_TOKEN` is the automatic token; `--publish always` uploads the installers + the
      # `latest*.yml` update manifests that electron-updater reads.
      #
      # CODE SIGNING is what makes auto-update work (Squirrel/NSIS refuse to self-install an
      # unsigned or mismatched build), and it's driven entirely by these env vars — electron-builder
      # picks them up with no config. Each is read only on the OS it applies to, and each is skipped
      # when the secret is unset, so this same step still produces working *unsigned* builds until
      # the certificates are in place. See RELEASING.md for how to produce each value.
      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          # Windows: Authenticode cert (.pfx) as base64, plus its password.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS: "Developer ID Application" cert (.p12) as base64, plus its password.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization — App Store Connect API key (preferred in CI: no 2FA, no Apple ID).
          # `APPLE_API_KEY` is exported by the "Materialize Apple API key" step above.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run build && pnpm exec electron-builder --publish always
